services:
  db:
    image: postgres:16-alpine
    container_name: traveller-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: traveller
      POSTGRES_PASSWORD: traveller
      POSTGRES_DB: traveller
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U traveller']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
